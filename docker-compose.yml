# Postgres de desenvolvimento, com a extensão pgvector (embeddings, RAG).
# Porta 5437 no host: a 5432 costuma estar ocupada por outros projetos.
# Rode o app com DB_HOST=127.0.0.1 DB_PORT=5437.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: job_agent_pgvector
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_agent_development

    ports:
      - "5437:5432"

    volumes:
      - job_agent_pgdata:/var/lib/postgresql/data

volumes:
  job_agent_pgdata:
    external: true
